spring:
  application:
    name: shopvi-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:shopvi}
    username: ${POSTGRES_USER:shopvi}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Fail nhanh khi Redis có sự cố; cache tự fallback về DB (CacheConfig)
      timeout: 2s
      connect-timeout: 2s
    web:
      pageable:
        max-page-size: 100
  cache:
    type: redis
    redis:
      # Số liệu hit/miss cho Prometheus (cache_gets_total)
      enable-statistics: true
  # Phase 5: tìm kiếm & event bus
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 10s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Payload là JSON dạng byte: Spring Modulith đăng ký ByteArrayJsonMessageConverter dùng chung cho KafkaTemplate
    # (gửi Message) và listener (tự chuyển JSON sang kiểu tham số của @KafkaListener)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      group-id: shopvi
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
  modulith:
    events:
      externalization:
        enabled: true
      # Sự kiện chưa xử lý xong (vd. Kafka tạm lỗi) được gửi lại khi khởi động
      republish-outstanding-events-on-restart: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  http:
    client:
      # RestClient gọi cổng thanh toán / hãng vận chuyển
      connect-timeout: 5s
      read-timeout: 15s
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # P7-6: Prometheus scrape /actuator/prometheus (prod: cổng quản trị riêng, không mở ra Internet)
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: shopvi-backend
    distribution:
      # Histogram để tính p95/p99 độ trễ API trên Prometheus/Grafana
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,200ms,500ms,1s
  observations:
    key-values:
      application: shopvi-backend

# Log: dev dạng chữ kèm requestId; prod dạng JSON (ECS) — xem application-prod.yml
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # P7-3: hạn mức theo IP (chưa đăng nhập) hoặc theo user; token bucket trên Redis
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    rules:
      login: { capacity: 10, period: 1m }
      register: { capacity: 5, period: 10m }
      refresh: { capacity: 30, period: 1m }
      checkout: { capacity: 10, period: 1m }
      chat: { capacity: 30, period: 1m }
      review: { capacity: 10, period: 1m }
  cache:
    key-prefix: ${CACHE_KEY_PREFIX:shopvi:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  auth:
    # Base64, >= 32 byte. Tạo bằng: openssl rand -base64 48
    jwt-secret: ${JWT_SECRET:}
    issuer: shopvi
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  order:
    # Phí ship ước tính mỗi đơn (VND) khi người mua chưa có địa chỉ nhận; có địa chỉ thì tính theo app.shipping
    shipping-fee: 30000
    expiry-job:
      # Hủy đơn thanh toán online quá hạn (app.payment.ttl) và hoàn kho
      enabled: true
      interval: 60s
  payment:
    # URL cổng thanh toán gọi về (return URL, IPN) — phải truy cập được từ Internet để nhận IPN
    public-base-url: ${PAYMENT_PUBLIC_BASE_URL:http://localhost:8080}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
    ttl: 15m
    sandbox-gateway: false
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    momo:
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
  search:
    enabled: ${SEARCH_ENABLED:true}
    alias: products
    reindex-on-startup: true
  shipping:
    item-weight-grams: 500
    default-origin-province: "79"
    # Bảng phí nội bộ (VND, kiện <= 1kg) — dùng khi chưa cấu hình GHN hoặc GHN lỗi
    rates:
      same-province: 22000
      same-region: 30000
      other-region: 38000
      extra-per-half-kg: 5000
    ghn:
      token: ${GHN_TOKEN:}
      shop-id: ${GHN_SHOP_ID:}
      base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
      webhook-token: ${GHN_WEBHOOK_TOKEN:}
  media:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:}
    secret-key: ${MINIO_ROOT_PASSWORD:}
    bucket: ${MEDIA_BUCKET:shopvi-media}
    region: ${MEDIA_REGION:}
    manage-bucket: ${MEDIA_MANAGE_BUCKET:true}
    url-includes-bucket: ${MEDIA_URL_INCLUDES_BUCKET:true}
    max-file-size: 5MB
