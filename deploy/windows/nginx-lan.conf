# nginx cho máy chủ Windows trong mạng LAN (HTTP, cổng 80) — cùng cách định tuyến với deploy/nginx.conf:
# /api + /ws → backend, /uploads → MinIO (ảnh upload), còn lại → frontend SSR. Mọi dịch vụ phía sau chỉ nghe 127.0.0.1.
# start-server.ps1 chạy: nginx -p <thư mục nginx> -c <file này>
worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout 65;
    access_log   logs/access.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Qua Cloudflare Tunnel (HTTPS) cloudflared gửi X-Forwarded-Proto: https → giữ nguyên; truy cập LAN trực tiếp → http
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Mỗi request có id (gửi tiếp cho backend → nằm trong log JSON để truy vết)
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ''      $request_id;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 6m;   # upload ảnh tối đa 5MB
        gzip on;
        gzip_types application/json application/javascript text/css image/svg+xml application/xml;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-Id      $req_id;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_read_timeout 60s;
        }

        # STOMP over SockJS (WebSocket + fallback XHR)
        location /ws/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }

        # Ảnh upload: MEDIA_PUBLIC_BASE_URL=http://<máy chủ>/uploads → MinIO (bucket đọc công khai). Không dùng /media: Angular đặt font của bản build ở đó
        # ^~: ưu tiên hơn location regex file tĩnh (.png/.jpg) bên dưới
        location ^~ /uploads/ {
            proxy_pass http://127.0.0.1:9000/;
            proxy_set_header Host 127.0.0.1:9000;
        }

        location /actuator/ { return 404; }

        # File tĩnh có hash trong tên: cache lâu ở trình duyệt
        location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
            proxy_pass http://127.0.0.1:4000;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://127.0.0.1:4000;
        }
    }
}
