# Reverse proxy production: TLS, /api + /ws → backend, còn lại → frontend SSR. Đổi shop.example.com thành tên miền thật.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Mỗi request có id (gửi tiếp cho backend → nằm trong log JSON để truy vết)
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ''      $request_id;
}

server {
    listen 80;
    server_name shop.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name shop.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 6m;   # upload ảnh tối đa 5MB
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/xml;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $req_id;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_read_timeout 60s;
    }

    # STOMP over SockJS (WebSocket + fallback XHR)
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # Actuator chỉ trong mạng nội bộ (cổng 8081, Prometheus scrape trực tiếp) — không chuyển ra ngoài
    location /actuator/ { return 404; }

    # Grafana (profile monitoring) — giới hạn IP quản trị
    location /grafana/ {
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass http://grafana:3000;
    }

    # File tĩnh có hash trong tên: cache lâu ở trình duyệt / CDN
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        proxy_pass http://frontend:4000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://frontend:4000;
    }
}
