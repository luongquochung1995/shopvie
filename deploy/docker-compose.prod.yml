# Triển khai production một máy (P7-7): nginx → frontend SSR + backend; dữ liệu trong volume.
# Ảnh (upload) lưu trên S3 / Cloudflare R2 và phục vụ qua CDN — không chạy MinIO ở production.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod --profile monitoring up -d   # + Prometheus/Grafana
#
# Biến môi trường: xem .env.example (mục "Production").
name: shopvi-prod

x-backend-env: &backend-env
  SPRING_PROFILES_ACTIVE: prod
  DB_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  ELASTICSEARCH_URIS: http://elasticsearch:9200
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: ${JWT_SECRET}
  CORS_ALLOWED_ORIGINS: ${SITE_URL}
  FRONTEND_BASE_URL: ${SITE_URL}
  PAYMENT_PUBLIC_BASE_URL: ${SITE_URL}
  VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
  VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
  VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
  MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
  MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
  MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
  GHN_TOKEN: ${GHN_TOKEN:-}
  GHN_SHOP_ID: ${GHN_SHOP_ID:-}
  GHN_BASE_URL: ${GHN_BASE_URL:-https://online-gateway.ghn.vn/shiip/public-api}
  GHN_WEBHOOK_TOKEN: ${GHN_WEBHOOK_TOKEN:-}
  # S3 / R2 + CDN cho ảnh
  MINIO_ENDPOINT: ${MEDIA_S3_ENDPOINT}
  MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY}
  MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY}
  MEDIA_BUCKET: ${MEDIA_BUCKET}
  MEDIA_REGION: ${MEDIA_REGION:-auto}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_CDN_URL}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Chứng chỉ TLS (Let's Encrypt / certbot) gắn vào đây
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  backend:
    build: ../backend
    image: shopvi/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-env
    expose:
      - "8080"
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build: ../frontend
    image: shopvi/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_ORIGIN: http://backend:8080
      SITE_URL: ${SITE_URL}
    expose:
      - "4000"

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Chỉ truy cập trong mạng nội bộ của compose; cụm nhiều node / dịch vụ quản lý thì bật security + TLS
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ----- Giám sát (P7-6): docker compose ... --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${SITE_URL}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"

volumes:
  postgres-data:
  redis-data:
  es-data:
  kafka-data:
  prometheus-data:
  grafana-data:
