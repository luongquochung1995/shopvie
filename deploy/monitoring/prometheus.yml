# Prometheus scrape backend qua cổng quản trị (8081, không mở ra Internet).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shopvi-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]
