# Kiểm tra toàn hệ thống trên runner có Docker (máy dev không có Docker):
# - P0-2 / DoD Phase 0: docker compose up (healthcheck), backend profile dev + seed, /actuator/health = UP
# - P7-1: SSR trang sản phẩm có thẻ SEO, Lighthouse SEO ≥ 90, sitemap.xml
# - P7-5: k6 tải đọc 500 RPS, p95 < 200ms (cùng máy với toàn bộ hạ tầng → kết quả thận trọng)
# - P7-7: build Docker image backend + frontend
name: Stack

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack:
    name: Compose + backend + SSR (SEO, load test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create .env
        run: |
          sed "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env.example > .env

      - name: docker compose up (wait for healthchecks)
        run: docker compose up -d --wait --wait-timeout 300 && docker compose ps

      - name: Build backend
        working-directory: backend
        run: ./mvnw -B -ntp -q -DskipTests package

      - name: Start backend (profile dev, seed data)
        run: |
          set -a; . ./.env; set +a
          # Load test gửi mọi request từ một IP
          RATE_LIMIT_ENABLED=false nohup java -Xms1g -Xmx1g -jar backend/target/shopvi-backend-*.jar \
            --spring.profiles.active=dev --logging.level.root=WARN > backend.log 2>&1 &
          for i in $(seq 90); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then break; fi
            sleep 2
          done
          curl -s http://localhost:8080/actuator/health | tee health.json | jq '{status, components: (.components | map_values(.status))}'
          jq -e '.status == "UP"' health.json

      - name: Build and start SSR frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          API_ORIGIN=http://localhost:8080 SITE_URL=http://localhost:8088 PORT=4000 \
            nohup node dist/shopvi-frontend/server/server.mjs > ../ssr.log 2>&1 &
          for i in $(seq 30); do curl -fs http://localhost:4000/robots.txt > /dev/null && break; sleep 1; done

      - name: Start nginx in front (/api → backend, rest → SSR), like production
        run: |
          cat > nginx-ci.conf <<'EOF'
          server {
            listen 8088;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            location /api/ { proxy_pass http://127.0.0.1:8080; }
            location /     { proxy_pass http://127.0.0.1:4000; }
          }
          EOF
          docker run -d --name nginx-ci --network host -v "$PWD/nginx-ci.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
          for i in $(seq 20); do curl -fs http://localhost:8088/robots.txt > /dev/null && break; sleep 1; done

      - name: SSR product page has SEO tags, sitemap lists products
        run: |
          SLUG=$(curl -s 'http://localhost:8080/api/v1/products?size=1&sort=soldCount,desc' | jq -r '.data.items[0].slug')
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          curl -s "http://localhost:8088/p/$SLUG" > product.html
          for tag in 'property="og:title"' 'property="og:image"' 'rel="canonical"' 'application/ld+json' 'name="description"'; do
            grep -q "$tag" product.html || { echo "missing $tag in SSR HTML"; exit 1; }
          done
          curl -fs http://localhost:8088/sitemap.xml | grep -c "<loc>http://localhost:8088/p/" | tee sitemap-count.txt
          test "$(cat sitemap-count.txt)" -gt 0

      - name: Lighthouse SEO (product page)
        run: |
          npx --yes lighthouse@12.8.2 "http://localhost:8088/p/$SLUG" --only-categories=seo \
            --output=json --output=html --output-path=./lighthouse \
            --chrome-flags="--headless=new --no-sandbox" --quiet
          SCORE=$(jq '.categories.seo.score * 100 | round' lighthouse.report.json)
          echo "Lighthouse SEO: $SCORE" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.categories.seo.auditRefs[].id as $id | .audits[$id] | select(.score != null and .score < 1) | "- failed: \(.id)"' \
            lighthouse.report.json | tee -a "$GITHUB_STEP_SUMMARY"
          test "$SCORE" -ge 90

      - uses: grafana/setup-k6-action@v1

      - name: k6 read APIs (500 RPS, p95 < 200ms)
        run: |
          # Làm nóng cache trước khi đo
          k6 run -q -e BASE_URL=http://localhost:8080 -e RPS=100 -e DURATION=20s loadtest/read-apis.js > /dev/null || true
          k6 run -e BASE_URL=http://localhost:8080 -e RPS=500 -e DURATION=1m \
            --summary-export=k6-read.json loadtest/read-apis.js
      - name: Load test summary
        if: always()
        run: |
          test -f k6-read.json || exit 0
          jq -r '"k6 500 RPS: p95 = \(.metrics.http_req_duration["p(95)"] | floor) ms, p99 = \(.metrics.http_req_duration["p(99)"] // 0 | floor) ms, failed = \(.metrics.http_req_failed.value * 100) %, requests = \(.metrics.http_reqs.count)"' \
            k6-read.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: stack-reports
          path: |
            health.json
            lighthouse.report.html
            lighthouse.report.json
            k6-read.json
            backend.log
            ssr.log
          retention-days: 7

  images:
    name: Docker images (multi-stage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t shopvi/backend:ci backend
      - name: Build frontend image
        run: docker build -t shopvi/frontend:ci frontend
      - name: Image sizes
        run: docker images 'shopvi/*' --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
